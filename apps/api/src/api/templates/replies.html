{% extends "base.html" %}
{% block title %}Replies{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Pending Replies</h1>
<div id="replies-list">
  <span class="text-gray-500">Loading...</span>
</div>

<script>
function startEdit(draftId, container) {
  const textEl = container.querySelector('p');
  const currentText = textEl ? textEl.textContent.trim() : '';
  container.innerHTML = `
    <form onsubmit="submitEdit(event, '${draftId}', this)">
      <textarea name="draft_text" rows="4"
        class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded text-sm text-gray-200 mb-2"
      >${currentText}</textarea>
      <div class="flex gap-2">
        <button type="submit" class="px-3 py-1 bg-indigo-700 hover:bg-indigo-600 rounded text-xs">Save</button>
        <button type="button" onclick="loadReplies()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs">Cancel</button>
      </div>
    </form>`;
}

async function submitEdit(e, draftId, form) {
  e.preventDefault();
  const data = new FormData(form);
  const res = await fetch(`/api/replies/${draftId}/update`, {method: 'POST', body: data});
  const html = await res.text();
  document.getElementById(`draft-text-${draftId}`).outerHTML = html;
}

async function loadReplies() {
  const res = await fetch('/api/replies');
  const drafts = await res.json();
  const el = document.getElementById('replies-list');
  if (!drafts.length) {
    el.innerHTML = '<span class="text-gray-500">No pending reply drafts.</span>';
    return;
  }
  const cards = drafts.map(d => {
    const ts = d.created_at ? d.created_at.slice(0,16).replace('T',' ') : '';
    const toneBadge = d.tone
      ? `<span class="text-xs text-indigo-400 bg-indigo-900/30 px-1 rounded ml-2">${d.tone}</span>`
      : '';
    return `<div class="mb-6 p-4 bg-gray-900 rounded border border-gray-800">
      <div class="flex items-center mb-2">
        <span class="font-medium">${d.sender || ''}</span>
        <span class="text-gray-500 text-sm ml-2">re: ${d.subject || ''}</span>
        ${toneBadge}
        <span class="ml-auto text-gray-600 text-xs">${ts}</span>
      </div>
      <div id="draft-text-${d.id}">
        <p class="text-gray-300 text-sm italic mb-2">${d.draft_text}</p>
        <button onclick="startEdit('${d.id}', this.parentElement)" class="text-xs text-indigo-400 hover:text-indigo-300">✏️ Edit</button>
      </div>
      <div id="reply-${d.id}" class="mt-3 flex gap-2">
        <button hx-post="/api/replies/${d.id}/send" hx-target="#reply-${d.id}" hx-swap="outerHTML"
          class="px-3 py-1 bg-green-800 hover:bg-green-700 rounded text-sm">✓ Send</button>
        <button hx-post="/api/replies/${d.id}/dismiss" hx-target="#reply-${d.id}" hx-swap="outerHTML"
          class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm">✗ Skip</button>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = cards;
  htmx.process(el);
}

loadReplies();
</script>
{% endblock %}
