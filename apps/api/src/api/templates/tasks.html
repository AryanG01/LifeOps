{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Open Tasks</h1>
<div id="tasks-list">
  <span class="text-gray-500">Loading...</span>
</div>

<script>
async function loadTasks() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  const el = document.getElementById('tasks-list');
  if (!tasks.length) {
    el.innerHTML = '<span class="text-gray-500">No open tasks.</span>';
    return;
  }
  const rows = tasks.map(t => {
    const overdueCls = t.overdue ? 'bg-red-950/30' : '';
    const priColor = t.priority >= 80 ? 'text-red-400' : t.priority >= 50 ? 'text-yellow-400' : 'text-gray-400';
    const statusBadge = t.status === 'proposed'
      ? '<span class="text-xs text-yellow-600 bg-yellow-900/40 px-1 rounded">proposed</span>'
      : '<span class="text-xs text-green-700 bg-green-900/40 px-1 rounded">active</span>';
    const dueStr = t.due_at
      ? `<span class="${t.overdue ? 'text-red-400' : 'text-gray-400'}">${t.due_at.slice(0,10)}</span>`
      : '<span class="text-gray-600">—</span>';
    return `<tr id="task-${t.id}" class="border-b border-gray-800 ${overdueCls}">
      <td class="py-2 pr-4 font-medium">${t.title}</td>
      <td class="pr-4">${statusBadge}</td>
      <td class="pr-4 ${priColor} text-sm">${t.priority ?? '—'}</td>
      <td class="pr-4 text-sm">${dueStr}</td>
      <td class="flex gap-2 py-2">
        <button hx-post="/api/tasks/${t.id}/accept" hx-target="#task-${t.id}" hx-swap="outerHTML"
          class="px-2 py-1 bg-green-800 hover:bg-green-700 rounded text-xs">Accept</button>
        <button hx-post="/api/tasks/${t.id}/dismiss" hx-target="#task-${t.id}" hx-swap="outerHTML"
          class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs">Dismiss</button>
      </td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="w-full text-sm">
    <thead class="text-gray-500 text-xs border-b border-gray-800">
      <tr><th class="pb-1 text-left pr-4">Title</th><th class="pr-4 text-left">Status</th><th class="pr-4 text-left">Pri</th><th class="pr-4 text-left">Due</th><th class="text-left">Actions</th></tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
  htmx.process(el);
}

loadTasks();
</script>
{% endblock %}
